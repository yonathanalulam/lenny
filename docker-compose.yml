services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: skilled_services
      POSTGRES_USER: skilled_services
      POSTGRES_PASSWORD: local_password
    ports:
      - "5432:5432"
    volumes:
      - skilled_services_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skilled_services -d skilled_services"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  skilled_services_postgres:
